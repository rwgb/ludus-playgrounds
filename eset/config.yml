ludus:
  - vm_name: "{{ range_id }}-ubuntu-eset-server"
    hostname: "eset-server"
    template: ubuntu-24.04-x64-server-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 4
    cpus: 2
    linux: true
    roles:
      - install-eset

  - vm_name: "{{ range_id }}-eee-esa"
    hostname: "SRV01"
    template: win2022-server-x64-eset-template
    vlan: 10
    ip_last_octet: 21
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: eset.local
      role: primary-dc
    roles:
      - disable-software-restrictions
      - install-chocolatey
      - install-java
      - download-eset-tools
      - configure-domain-user

  - vm_name: "{{ range_id }}-bridge-rds"
    hostname: "SRV02"
    template: win2022-server-x64-eset-template
    vlan: 10
    ip_last_octet: 22
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: eset.local
      role: alt-dc
    roles:
      - disable-software-restrictions
      - install-chocolatey
      - install-eset-bridge-rds

  - vm_name: "{{ range_id }}-eei"
    hostname: "SRV03"
    template: win2022-server-x64-eset-template
    vlan: 10
    ip_last_octet: 23
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    domain:
      fqdn: eset.local
      role: alt-dc
    roles:
      - disable-software-restrictions
      - install-chocolatey
      - download-eset-inspector

  - vm_name: "{{ range_id }}-win11-workstation"
    hostname: "WIN11"
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 30
    ram_gb: 4
    cpus: 2
    windows:
      sysprep: true
    roles:
      - disable-software-restrictions
      - install-chocolatey
