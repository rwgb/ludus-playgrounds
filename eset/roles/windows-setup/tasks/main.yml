---
# Disable security restrictions
- name: Disable User Account Control (UAC)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: EnableLUA
    data: 0
    type: dword
  
- name: Disable Windows Installer restrictions - User Installs
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer
    name: DisableMSI
    data: 0
    type: dword

- name: Remove AlwaysInstallElevated restriction
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer
    name: AlwaysInstallElevated
    data: 1
    type: dword

- name: Disable software restriction policies
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Safer\CodeIdentifiers
    name: DefaultLevel
    data: 262144
    type: dword
  ignore_errors: yes

- name: Disable Windows Defender (for easier software installation)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender
    name: DisableAntiSpyware
    data: 1
    type: dword

- name: Disable Windows Firewall for Domain profile
  ansible.windows.win_shell: |
    Set-NetFirewallProfile -Profile Domain -Enabled False
  ignore_errors: yes

- name: Disable Windows Firewall for Private profile
  ansible.windows.win_shell: |
    Set-NetFirewallProfile -Profile Private -Enabled False
  ignore_errors: yes

- name: Disable Windows Firewall for Public profile
  ansible.windows.win_shell: |
    Set-NetFirewallProfile -Profile Public -Enabled False
  ignore_errors: yes

- name: Set execution policy to Unrestricted
  ansible.windows.win_shell: |
    Set-ExecutionPolicy -ExecutionPolicy Unrestricted -Force -Scope LocalMachine
  ignore_errors: yes

# Install Chocolatey
- name: Check if Chocolatey is already installed
  ansible.windows.win_command: choco --version
  register: choco_check
  changed_when: false
  failed_when: false

- name: Display Chocolatey already installed message
  ansible.builtin.debug:
    msg: "Chocolatey is already installed. Skipping installation."
  when: choco_check.rc == 0

- name: Restart Windows to apply security changes (if Chocolatey not installed)
  ansible.windows.win_reboot:
    reboot_timeout: 600
    post_reboot_delay: 120
  when: choco_check.rc != 0

- name: Wait for system to be fully ready after reboot
  ansible.builtin.wait_for_connection:
    timeout: 300
    delay: 30
  when: choco_check.rc != 0

- name: Install Chocolatey package manager
  ansible.windows.win_shell: |
    Set-ExecutionPolicy Bypass -Scope Process -Force
    [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
    iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
  register: choco_install
  when: choco_check.rc != 0

- name: Verify Chocolatey installation
  ansible.windows.win_command: choco --version
  register: choco_version
  changed_when: false

- name: Install vcredist-all package via Chocolatey
  ansible.windows.win_shell: |
    choco install vcredist-all -y
  register: vcredist_install
  retries: 3
  delay: 10
  until: vcredist_install.rc == 0
  failed_when: false

- name: Install Notepad++ via Chocolatey
  ansible.windows.win_shell: |
    choco install notepadplusplus -y
  register: npp_install
  retries: 3
  delay: 10
  until: npp_install.rc == 0
  failed_when: false

- name: Display Windows setup completion
  ansible.builtin.debug:
    msg:
      - "Windows setup complete on {{ inventory_hostname }}"
      - "UAC, Defender, and Firewall disabled"
      - "Chocolatey version {{ choco_version.stdout.strip() }} installed"
      - "Installed packages: vcredist-all, notepadplusplus"
