---
- name: Check if already domain joined
  ansible.builtin.shell: |
    realm list | grep -q 'configured: kerberos-member' && echo "JOINED" || echo "NOT_JOINED"
  register: domain_join_check
  changed_when: false
  failed_when: false

- name: Display domain join status
  ansible.builtin.debug:
    msg: "System is already joined to {{ ad_domain }}. Skipping domain join."
  when: domain_join_check.stdout == "JOINED"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
  become: yes
  when: domain_join_check.stdout == "NOT_JOINED"

- name: Install required packages for AD domain join
  ansible.builtin.apt:
    name:
      - realmd
      - sssd
      - sssd-tools
      - libnss-sss
      - libpam-sss
      - adcli
      - krb5-user
      - samba-common-bin
      - packagekit
    state: present
  become: yes
  when: domain_join_check.stdout == "NOT_JOINED"

- name: Configure /etc/hosts with domain controller entry
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ ad_dc_ip }}    {{ ad_dc_hostname }} SRV01"
    state: present
  become: yes
  when: domain_join_check.stdout == "NOT_JOINED"

- name: Set DNS to domain controller
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNS='
    line: "DNS={{ ad_dc_ip }}"
    state: present
  become: yes
  notify: restart systemd-resolved
  when: domain_join_check.stdout == "NOT_JOINED"

- name: Set DNS domain
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?Domains='
    line: "Domains={{ ad_domain }}"
    state: present
  become: yes
  notify: restart systemd-resolved
  when: domain_join_check.stdout == "NOT_JOINED"

- name: Restart systemd-resolved to apply DNS changes
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  become: yes
  when: domain_join_check.stdout == "NOT_JOINED"

- name: Wait for DNS to propagate
  ansible.builtin.pause:
    seconds: 5
  when: domain_join_check.stdout == "NOT_JOINED"

- name: Test DNS resolution of domain controller
  ansible.builtin.shell: nslookup {{ ad_dc_hostname }}
  register: dns_test
  become: yes
  changed_when: false
  failed_when: false
  when: domain_join_check.stdout == "NOT_JOINED"

- name: Display DNS test result
  ansible.builtin.debug:
    var: dns_test.stdout_lines
  when: 
    - domain_join_check.stdout == "NOT_JOINED"
    - dns_test.stdout_lines is defined

- name: Configure Kerberos realm
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: '0644'
  become: yes
  when: domain_join_check.stdout == "NOT_JOINED"

- name: Discover AD domain
  ansible.builtin.shell: realm discover {{ ad_domain }}
  register: realm_discover
  become: yes
  changed_when: false
  retries: 5
  delay: 10
  until: realm_discover.rc == 0
  when: domain_join_check.stdout == "NOT_JOINED"

- name: Display realm discovery result
  ansible.builtin.debug:
    var: realm_discover.stdout_lines
  when: 
    - domain_join_check.stdout == "NOT_JOINED"
    - realm_discover.stdout_lines is defined

- name: Join domain using realm
  ansible.builtin.shell: |
    echo "{{ ad_admin_password }}" | realm join --user={{ ad_admin_user }} {{ ad_domain }} --verbose
  register: realm_join
  become: yes
  when: domain_join_check.stdout == "NOT_JOINED"

- name: Display realm join result
  ansible.builtin.debug:
    msg: "{{ realm_join.stdout_lines }}"
  when: 
    - domain_join_check.stdout == "NOT_JOINED"
    - realm_join.stdout_lines is defined

- name: Configure SSSD for home directory creation
  ansible.builtin.lineinfile:
    path: /etc/sssd/sssd.conf
    regexp: '^fallback_homedir'
    line: 'fallback_homedir = /home/%u@%d'
    state: present
  become: yes
  notify: restart sssd
  when: domain_join_check.stdout == "NOT_JOINED"

- name: Enable automatic home directory creation
  ansible.builtin.shell: pam-auth-update --enable mkhomedir
  become: yes
  when: domain_join_check.stdout == "NOT_JOINED"

- name: Verify domain membership
  ansible.builtin.shell: realm list
  register: realm_list
  become: yes
  changed_when: false

- name: Display final domain status
  ansible.builtin.debug:
    msg: "{{ realm_list.stdout_lines }}"
  when: realm_list.stdout_lines is defined

- name: Display domain join summary
  ansible.builtin.debug:
    msg:
      - "Domain join complete for {{ ad_domain }}"
      - "Domain users can now authenticate with username@{{ ad_domain }}"
      - "Example: ssh localuser@{{ ad_domain }}@{{ ansible_hostname }}"
