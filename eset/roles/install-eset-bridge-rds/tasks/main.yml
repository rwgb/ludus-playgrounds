---
- name: Create ESET installers directory
  ansible.windows.win_file:
    path: "{{ eset_download_dir }}"
    state: directory

- name: Check if ESET Bridge is already installed
  ansible.windows.win_service:
    name: "ESET Management Connector"
  register: eset_bridge_check
  ignore_errors: yes

- name: Check if Rogue Detection Sensor is already installed
  ansible.windows.win_service:
    name: "ESET Rogue Detection Sensor"
  register: rdsensor_check
  ignore_errors: yes

- name: Display ESET Bridge installation status
  ansible.builtin.debug:
    msg: "ESET Bridge is already installed. Skipping installation."
  when: eset_bridge_check.exists is defined and eset_bridge_check.exists

- name: Display Rogue Detection Sensor installation status
  ansible.builtin.debug:
    msg: "Rogue Detection Sensor is already installed. Skipping installation."
  when: rdsensor_check.exists is defined and rdsensor_check.exists

- name: Download ESET Bridge installer
  ansible.windows.win_get_url:
    url: "{{ eset_bridge_url }}"
    dest: "{{ eset_download_dir }}\\{{ eset_bridge_filename }}"
    force: false
  register: bridge_download
  retries: 3
  delay: 10
  until: bridge_download is succeeded
  when: eset_bridge_check.exists is not defined or not eset_bridge_check.exists

- name: Download Rogue Detection Sensor installer
  ansible.windows.win_get_url:
    url: "{{ rdsensor_url }}"
    dest: "{{ eset_download_dir }}\\{{ rdsensor_filename }}"
    force: false
  register: rdsensor_download
  retries: 3
  delay: 10
  until: rdsensor_download is succeeded
  when: rdsensor_check.exists is not defined or not rdsensor_check.exists

- name: Install ESET Bridge
  ansible.windows.win_package:
    path: "{{ eset_download_dir }}\\{{ eset_bridge_filename }}"
    state: present
    arguments: /quiet /norestart
  register: bridge_install
  async: 1800
  poll: 30
  when: eset_bridge_check.exists is not defined or not eset_bridge_check.exists

- name: Display installation status
  ansible.builtin.debug:
    msg:
      - "ESET Bridge installation complete (Rogue Detection Sensor requires manual installation)"
      - "ESET Bridge already installed: {{ eset_bridge_check.exists | default(false) }}"
      - "Rogue Detection Sensor installer downloaded to: {{ eset_download_dir }}\\{{ rdsensor_filename }}"
      - "WARNING: Install WinPcap 4.1+ or Npcap (with WinPcap compatibility mode) manually BEFORE installing RDS"
      - "Npcap download: https://npcap.com/dist/npcap-1.79.exe (use /S /winpcap_mode=yes for silent install)"
      - "After installing WinPcap/Npcap, install RDS manually from {{ eset_download_dir }}\\{{ rdsensor_filename }}"
