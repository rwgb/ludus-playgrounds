---
- name: Check if ESET Agent registry key exists
  ansible.windows.win_reg_stat:
    path: "{{ eset_registry_path }}"
  register: eset_reg_check

- name: Generate new UUID if not specified
  ansible.builtin.set_fact:
    generated_uuid: "{{ lookup('community.general.random_string', length=8, min_lower=0, min_upper=0, min_numeric=0, override_special='abcdef0123456789') }}-{{ lookup('community.general.random_string', length=4, min_lower=0, min_upper=0, min_numeric=0, override_special='abcdef0123456789') }}-{{ lookup('community.general.random_string', length=4, min_lower=0, min_upper=0, min_numeric=0, override_special='abcdef0123456789') }}-{{ lookup('community.general.random_string', length=4, min_lower=0, min_upper=0, min_numeric=0, override_special='abcdef0123456789') }}-{{ lookup('community.general.random_string', length=12, min_lower=0, min_upper=0, min_numeric=0, override_special='abcdef0123456789') }}"
  when: 
    - eset_reg_check.exists
    - eset_new_uuid == ""

- name: Use provided UUID if specified
  ansible.builtin.set_fact:
    generated_uuid: "{{ eset_new_uuid }}"
  when: 
    - eset_reg_check.exists
    - eset_new_uuid != ""

- name: Modify ESET ProductInstanceID UUID
  ansible.windows.win_regedit:
    path: "{{ eset_registry_path }}"
    name: "{{ eset_uuid_value_name }}"
    data: "{{ generated_uuid }}"
    type: string
  when: eset_reg_check.exists
  register: uuid_modified

- name: Display modified UUID
  ansible.builtin.debug:
    msg: "ESET ProductInstanceID changed to: {{ generated_uuid }}"
  when: 
    - eset_reg_check.exists
    - uuid_modified is changed

- name: Notify if ESET registry key not found
  ansible.builtin.debug:
    msg: "ESET Agent registry key not found at {{ eset_registry_path }}. Skipping UUID modification."
  when: not eset_reg_check.exists
