---
- name: Install Chocolatey package manager
  ansible.windows.win_chocolatey:
    name: chocolatey
    state: present
  register: choco_install
  retries: 3
  delay: 10
  until: choco_install is succeeded

- name: Verify Chocolatey installation
  ansible.windows.win_command: choco --version
  register: choco_version
  changed_when: false

- name: Display Chocolatey version
  ansible.builtin.debug:
    msg: "Chocolatey version {{ choco_version.stdout }} installed successfully"
